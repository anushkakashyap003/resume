<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fdf0f8 0%, #f0e8ff 40%, #e8f0ff 100%);
    font-family: 'Georgia', serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #sparkle-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #stage {
    width: 100%; max-width: 560px; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1rem; position: relative; z-index: 1;
  }
  #fairy-wrap { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  #fairy-svg { width: 200px; height: 240px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 8px 24px rgba(200,150,255,0.25)); }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes wandPulse { 0%,100%{opacity:.6} 50%{opacity:1} }
  #wand-star { animation: wandPulse 1.2s ease-in-out infinite; }
  @keyframes wingLeft  { 0%,100%{transform:scaleX(1) skewY(0deg)} 50%{transform:scaleX(.85) skewY(-3deg)} }
  @keyframes wingRight { 0%,100%{transform:scaleX(1) skewY(0deg)} 50%{transform:scaleX(.85) skewY(3deg)} }
  #wing-l { transform-origin:100% 50%; animation:wingLeft  .9s ease-in-out infinite; }
  #wing-r { transform-origin:0%   50%; animation:wingRight .9s ease-in-out infinite; }
  #spell-text { font-size:1.1rem; color:#9b6cb5; text-align:center; letter-spacing:.04em; min-height:1.8em; transition:opacity .4s; }
  #reveal-btn {
    padding:.75rem 2.2rem; background:linear-gradient(135deg,#d4a8f0,#a88fe8); color:#fff;
    border:none; border-radius:2rem; font-size:1rem; font-family:'Georgia',serif; cursor:pointer;
    letter-spacing:.06em; box-shadow:0 4px 18px rgba(168,143,232,.4); transition:transform .2s,box-shadow .2s;
  }
  #reveal-btn:hover { transform:scale(1.05); box-shadow:0 6px 24px rgba(168,143,232,.55); }
  #reveal-btn:active { transform:scale(.97); }
  #flash {
    position:fixed; inset:0;
    background:radial-gradient(circle at center,rgba(255,255,255,.95) 0%,rgba(220,190,255,.6) 60%,transparent 100%);
    opacity:0; pointer-events:none; z-index:100; transition:opacity .15s;
  }
  #flash.on { opacity:1; }
  #resume-section { display:none; width:100%; max-width:860px; padding:2rem 1.5rem 4rem; animation:fadeUp .7s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
  #resume-iframe {
    width:100%; height:85vh; min-height:640px; border:none;
    border-radius:16px; box-shadow:0 8px 40px rgba(168,143,232,.25); background:#fff;
  }
  #dl-btn {
    display:block; margin:1.5rem auto 0; padding:.75rem 2.5rem;
    background:linear-gradient(135deg,#f7c8ea,#d4a8f0); color:#5a3480;
    border:none; border-radius:2rem; font-size:.95rem; font-family:'Georgia',serif;
    font-weight:600; cursor:pointer; letter-spacing:.05em;
    box-shadow:0 4px 16px rgba(212,168,240,.4); transition:transform .2s,box-shadow .2s;
    text-decoration:none; text-align:center; width:fit-content;
  }
  #dl-btn:hover { transform:scale(1.04); box-shadow:0 6px 22px rgba(168,143,232,.5); }
  #fairy-mini {
    display:none; position:fixed; bottom:1.5rem; right:1.5rem; z-index:50;
    animation:float 3s ease-in-out infinite; cursor:pointer; width:64px; height:76px;
    filter:drop-shadow(0 4px 10px rgba(200,150,255,.3));
  }
  @media(max-width:480px) {
    #fairy-svg{width:160px;height:192px;}
    #resume-section{padding:1rem .5rem 3rem;}
  }
</style>

<script>
const canvas = document.getElementById('sparkle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);
function spawnSparkle(x,y,burst=false){
  const count=burst?18:1;
  for(let i=0;i<count;i++){
    const angle=burst?(Math.PI*2*i/count):Math.random()*Math.PI*2;
    const speed=burst?(2+Math.random()*4):(0.3+Math.random()*.7);
    particles.push({
      x:x??Math.random()*canvas.width, y:y??Math.random()*canvas.height,
      vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-(burst?0:.5),
      size:burst?3+Math.random()*5:1.5+Math.random()*2.5,
      life:1, decay:burst?.02+Math.random()*.02:.008+Math.random()*.012,
      hue:burst?Math.random()*60+260:Math.random()*80+270
    });
  }
}
function animParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(Math.random()<.3) spawnSparkle();
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle='hsl('+p.hue+',90%,75%)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  requestAnimationFrame(animParticles);
}
animParticles();

const spells=["Abracadabra… ✨","Bibbidi-bobbidi-boo… 🌸","Sparkle, shimmer, shine… 💫","REVEAL! 🪄✨"];
function castSpell(){
  const btn=document.getElementById('reveal-btn');
  const text=document.getElementById('spell-text');
  btn.disabled=true; btn.style.opacity='.5';
  const rect=document.getElementById('fairy-svg').getBoundingClientRect();
  spawnSparkle(rect.right-30,rect.top+rect.height*.3,true);
  let i=0;
  const tick=setInterval(()=>{
    text.textContent=spells[i++];
    spawnSparkle(rect.right-30+(Math.random()-.5)*60,rect.top+rect.height*.3+(Math.random()-.5)*40,true);
    if(i>=spells.length){ clearInterval(tick); setTimeout(boom,400); }
  },500);
}
function boom(){
  spawnSparkle(window.innerWidth/2,window.innerHeight/2,true);
  setTimeout(()=>spawnSparkle(window.innerWidth/2,window.innerHeight/2,true),100);
  setTimeout(()=>spawnSparkle(window.innerWidth/2,window.innerHeight/2,true),200);
  const flash=document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(()=>{ flash.classList.remove('on'); showResume(); },250);
}
function showResume(){
  document.getElementById('stage').style.display='none';
  const s=document.getElementById('resume-section');
  s.style.display='block';
  document.getElementById('fairy-mini').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
</script>
